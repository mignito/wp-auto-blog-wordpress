name: WordPress Auto Blog

on:
  schedule:
    - cron: '0 0 * * *'   # 한국시간 오전 9시 (KST = UTC+9)
    - cron: '0 4 * * *'   # 한국시간 오후 1시 (KST = UTC+9)
    - cron: '0 8 * * *'   # 한국시간 오후 5시 (KST = UTC+9)
    - cron: '0 12 * * *'  # 한국시간 오후 9시 (KST = UTC+9)
    - cron: '0 16 * * *'  # 한국시간 오전 1시 (KST = UTC+9)
    - cron: '0 20 * * *'  # 한국시간 오전 5시 (KST = UTC+9)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 자동 포스팅 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_POST_STATUS: publish
          PYTHONIOENCODING: utf-8
        run: python main.py --site life

      - name: 자동 포스팅 실행 (winone-worker.com)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          WP_URL: ${{ secrets.WP_URL_2 }}
          WP_USERNAME: ${{ secrets.WP_USERNAME_2 }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD_2 }}
          WP_POST_STATUS: publish
          PYTHONIOENCODING: utf-8
        run: python main.py --site worker

      - name: 실패 시 알림
        if: failure()
        run: echo "포스팅 실패! GitHub Actions 로그를 확인하세요."
